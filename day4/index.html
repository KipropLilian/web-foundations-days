<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Live Note Editor</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <label for="note-text">Write your note:</label>
      <textarea
        id="note-text"
        maxlength="200"
        placeholder="Start typing your note..."
      ></textarea>

      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <button id="clear-btn" type="button">Clear note</button>
    </main>
  </body>
</html>
